<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DB Diagnosis Assistant</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; }
.card h1 { font-size: 22px; color: #e94560; margin-bottom: 24px; text-align: center; }
.tabs { display: flex; gap: 0; margin-bottom: 20px; }
.tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #0f3460; background: #1a1a2e; color: #888; font-size: 14px; font-weight: 600; transition: all 0.15s; }
.tab:first-child { border-radius: 8px 0 0 8px; }
.tab:last-child { border-radius: 0 8px 8px 0; }
.tab.active { background: #16213e; color: #e94560; border-color: #e94560; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
.pw-wrap { position: relative; }
.pw-wrap input { width: 100%; padding: 10px 40px 10px 12px; border: 1px solid #0f3460; border-radius: 8px; background: #1a1a2e; color: #e0e0e0; font-size: 14px; outline: none; }
.pw-wrap input:focus { border-color: #e94560; }
.eye-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #666; cursor: pointer; font-size: 16px; padding: 4px; line-height: 1; }
.eye-btn:hover { color: #aaa; }
.field input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid #0f3460; border-radius: 8px; background: #1a1a2e; color: #e0e0e0; font-size: 14px; outline: none; }
.field input[type="text"]:focus { border-color: #e94560; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; background: #e94560; color: #fff; margin-top: 8px; }
.btn:hover { background: #c73650; }
.btn:disabled { background: #444; cursor: not-allowed; }
#msg { margin-top: 16px; font-size: 13px; min-height: 20px; text-align: center; }
#msg.ok { color: #4ecca3; }
#msg.err { color: #e94560; }
</style>
</head>
<body>

<div class="card">
  <h1>DB Diagnosis Assistant</h1>
  <div class="tabs">
    <div class="tab active" id="tab-login">Login</div>
    <div class="tab" id="tab-register">Register</div>
  </div>

  <div id="form-login">
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-user" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="login-pass" autocomplete="current-password">
        <button class="eye-btn" type="button" onclick="togglePw('login-pass', this)" title="Toggle visibility">&#128065;</button>
      </div>
    </div>
    <button class="btn" id="login-btn">Login</button>
  </div>

  <div id="form-register" style="display:none;">
    <div class="field">
      <label>Username</label>
      <input type="text" id="reg-user" autocomplete="username" minlength="3" maxlength="32">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="reg-pass" autocomplete="new-password" minlength="6" maxlength="64">
        <button class="eye-btn" type="button" onclick="togglePw('reg-pass', this)" title="Toggle visibility">&#128065;</button>
      </div>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="reg-pass2" autocomplete="new-password">
        <button class="eye-btn" type="button" onclick="togglePw('reg-pass2', this)" title="Toggle visibility">&#128065;</button>
      </div>
    </div>
    <button class="btn" id="reg-btn">Register</button>
  </div>

  <div id="msg"></div>
</div>

<script>
function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '\u{1F441}';
  } else {
    input.type = 'password';
    btn.textContent = '\u{1F576}';
  }
}

const tabLogin = document.getElementById('tab-login');
const tabRegister = document.getElementById('tab-register');
const formLogin = document.getElementById('form-login');
const formRegister = document.getElementById('form-register');
const msgEl = document.getElementById('msg');

function switchTab(tab) {
  tabLogin.classList.toggle('active', tab === 'login');
  tabRegister.classList.toggle('active', tab === 'register');
  formLogin.style.display = tab === 'login' ? '' : 'none';
  formRegister.style.display = tab === 'register' ? '' : 'none';
  msgEl.textContent = '';
  msgEl.className = '';
}

tabLogin.addEventListener('click', () => switchTab('login'));
tabRegister.addEventListener('click', () => switchTab('register'));

function showMsg(text, ok) {
  msgEl.textContent = text;
  msgEl.className = ok ? 'ok' : 'err';
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!username || !password) { showMsg('Please enter username and password.', false); return; }
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (resp.ok && data.access_token) {
      localStorage.setItem('jwt_token', data.access_token);
      showMsg('Login successful! Redirecting...', true);
      setTimeout(() => window.location.href = '/', 500);
    } else {
      showMsg(data.detail || 'Login failed.', false);
    }
  } catch (e) {
    showMsg('Error: ' + e.message, false);
  }
}

async function doRegister() {
  const username = document.getElementById('reg-user').value.trim();
  const password = document.getElementById('reg-pass').value;
  const password2 = document.getElementById('reg-pass2').value;
  if (!username || !password) { showMsg('Please enter username and password.', false); return; }
  if (username.length < 3) { showMsg('Username must be at least 3 characters.', false); return; }
  if (password.length < 6) { showMsg('Password must be at least 6 characters.', false); return; }
  if (password !== password2) { showMsg('Passwords do not match.', false); return; }
  try {
    const resp = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (resp.ok && data.access_token) {
      localStorage.setItem('jwt_token', data.access_token);
      showMsg('Registration successful! Redirecting...', true);
      setTimeout(() => window.location.href = '/', 500);
    } else {
      showMsg(data.detail || 'Registration failed.', false);
    }
  } catch (e) {
    showMsg('Error: ' + e.message, false);
  }
}

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('reg-btn').addEventListener('click', doRegister);

document.getElementById('login-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('reg-pass2').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doRegister();
});

if (localStorage.getItem('jwt_token')) {
  window.location.href = '/';
}
</script>
</body>
</html>
